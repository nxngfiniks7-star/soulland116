name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Unzip project
        run: unzip -q SoulLand-1.16.5-github.zip -d proj
      - name: Install Gradle 7.4.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.4.2-bin.zip
          unzip -q gradle-7.4.2-bin.zip -d "$HOME"
          echo "$HOME/gradle-7.4.2/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cd proj && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SoulLand-jar
          path: proj/build/libs/*.jar
